# Публикация статической страницы на GitHub Pages — ручной fallback.
#
# Основной способ в этом репозитории: Settings → Pages → Source:
# «Deploy from a branch», ветка main, папка /docs. Страницу отдаёт
# сгенерированная папка docs/ (её собирает `npm run build:pages` из public/).
# Этот workflow при source=branch не запускается и не нужен.
#
# Workflow оставлен на случай перехода на Source: GitHub Actions:
# он собирает артефакт из public/ и подставляет API_BASE из repository
# variable в config.js. Запускается только вручную (Actions → Run workflow).
#
# Автовключение Pages (enablement) работает только с токеном, отличным от
# GITHUB_TOKEN: если добавить secret PAGES_TOKEN (PAT со scope `repo` или
# правом Pages write), Pages включится сам при первом запуске.

name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact from public/ and inject API_BASE
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          node -e '
            const fs = require("node:fs");
            const base = (process.env.API_BASE || "").trim();
            const body =
              "\x27use strict\x27;\n\n" +
              "// Generated by .github/workflows/pages.yml from the API_BASE repository variable.\n" +
              "window.__PHP2SHELL_API__ = " + JSON.stringify(base) + ";\n";
            fs.writeFileSync("_site/config.js", body);
            console.log("API_BASE is " + (base ? "set" : "empty (same-origin / not configured)"));
          '
          test -f _site/index.html
          test -f _site/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # enablement требует токен, отличный от GITHUB_TOKEN, поэтому
          # включаем его только когда добавлен secret PAGES_TOKEN.
          enablement: ${{ secrets.PAGES_TOKEN != '' }}
          token: ${{ secrets.PAGES_TOKEN != '' && secrets.PAGES_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
