<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHP2Shell</title>
  <meta name="description" content="">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M12%202.5%204.5%205.6v5.7c0%204.6%203.1%208.6%207.5%2010.2%204.4-1.6%207.5-5.6%207.5-10.2V5.6L12%202.5Z'%20fill='%231c4ed8'/%3E%3C/svg%3E">
  <!-- config.js: API base (injected by the Pages workflow from API_BASE).
       i18n.js is the single source of strings for ru/en/fr. Both load
       synchronously so app.js sees them before the first paint. -->
  <script src="./config.js"></script>
  <script src="./i18n.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="ui.skip"></a>

  <header class="site-header">
    <div class="wrap header-inner">
      <span class="brand">
        <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2.5 4.5 5.6v5.7c0 4.6 3.1 8.6 7.5 10.2 4.4-1.6 7.5-5.6 7.5-10.2V5.6L12 2.5Z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="m8.6 11.9 2.3 2.4 4.5-4.9" fill="none" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">PHP2Shell</span>
        <span class="brand-note" data-i18n="ui.brandNote"></span>
      </span>

      <div class="header-right">
        <span class="header-cves">CVE-2026-109618 · CVE-2026-109619</span>
        <div id="lang-switch" class="lang-switch" role="group" data-i18n-aria-label="ui.lang.label">
          <button type="button" class="lang-btn" data-lang="ru" lang="ru" aria-pressed="false">RU</button>
          <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="false">EN</button>
          <button type="button" class="lang-btn" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title" data-i18n="ui.hero.title"></h1>
      <p class="lede" id="hero-lede" data-i18n="ui.hero.lede"></p>
      <p class="hero-cta">
        <a class="fix-cta" href="./fix/" data-fix-link data-i18n="ui.fixCta"></a>
      </p>
    </section>

    <section class="checker" aria-labelledby="checker-title">
      <h2 id="checker-title" class="visually-hidden" data-i18n="ui.checker.title"></h2>
      <form id="check-form" novalidate>
        <div class="field">
          <label for="target-url" data-i18n="ui.form.label"></label>
          <div class="input-row">
            <input id="target-url" name="url" type="text" inputmode="url" autocomplete="url"
                   spellcheck="false" autocapitalize="off"
                   data-i18n-placeholder="ui.form.placeholder"
                   aria-describedby="url-hint form-error">
            <button id="check-button" type="submit" disabled data-i18n="ui.form.submit"></button>
          </div>
          <p id="url-hint" class="hint" data-i18n="ui.form.hint"></p>
        </div>

        <label class="consent" for="consent">
          <input id="consent" type="checkbox">
          <span data-i18n="ui.form.consent"></span>
        </label>

        <div class="deep-opt">
          <label class="consent consent--deep" for="deep">
            <input id="deep" type="checkbox">
            <span data-i18n="ui.form.deep"></span>
          </label>
          <p id="deep-hint" class="hint" data-i18n="ui.form.deepHint"></p>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>
      </form>
    </section>

    <section id="warn" class="warn-band" aria-labelledby="warn-title">
      <div class="warn-copy">
        <h2 id="warn-title" data-i18n="ui.warn.title"></h2>
        <p data-i18n="ui.warn.intro"></p>
      </div>
      <div class="warn-action">
        <button id="warn-team" class="btn btn--quiet" type="button"
                data-i18n="ui.actions.warn" data-i18n-aria-label="ui.actions.warnAria"></button>
        <span id="warn-status" class="copy-status" role="status" aria-live="polite"></span>
      </div>
    </section>

    <section id="result" class="result" data-state="idle" aria-live="polite" aria-busy="false">
      <div class="idle">
        <h2 data-i18n="ui.idle.title"></h2>
        <div class="idle-grid">
          <div class="idle-item">
            <svg class="idle-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 6.5h16M4 12h16M4 17.5h9" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <h3 data-i18n="ui.idle.php.title"></h3>
            <p data-i18n-html="ui.idle.php.text"></p>
          </div>
          <div class="idle-item">
            <svg class="idle-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3.2 21 19.2H3L12 3.2Z" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M12 9.4v4.2M12 16.8v.1" fill="none" stroke="currentColor"
                    stroke-width="1.9" stroke-linecap="round"/>
            </svg>
            <h3 data-i18n="ui.idle.cve.title"></h3>
            <p data-i18n="ui.idle.cve.text"></p>
          </div>
          <div class="idle-item">
            <svg class="idle-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3 data-i18n="ui.idle.actions.title"></h3>
            <p data-i18n="ui.idle.actions.text"></p>
          </div>
        </div>
        <p class="idle-note" data-i18n="ui.idle.note"></p>
      </div>
    </section>

    <div id="result-actions" class="result-actions" hidden>
      <button id="check-again" class="btn btn--quiet" type="button" data-i18n="ui.actions.again"></button>
    </div>

    <section id="facts" class="info-section facts" aria-labelledby="facts-title">
      <h2 id="facts-title" data-i18n="ui.facts.title"></h2>
      <p class="section-intro" data-i18n="ui.facts.intro"></p>
      <div class="fact-grid">
        <article class="fact-card">
          <p class="fact-kicker" data-i18n="ui.facts.kicker"></p>
          <blockquote class="fact-quote" data-i18n="ui.facts.php81.title"></blockquote>
          <p data-i18n="ui.facts.php81.text"></p>
          <button class="btn btn--quiet fact-copy" type="button" data-copy-fact="php81"
                  data-i18n="ui.facts.php81.copy" data-i18n-aria-label="ui.facts.php81.aria"></button>
        </article>
        <article class="fact-card">
          <p class="fact-kicker" data-i18n="ui.facts.kicker"></p>
          <blockquote class="fact-quote" data-i18n="ui.facts.versions.title"></blockquote>
          <p data-i18n="ui.facts.versions.text"></p>
          <button class="btn btn--quiet fact-copy" type="button" data-copy-fact="versions"
                  data-i18n="ui.facts.versions.copy" data-i18n-aria-label="ui.facts.versions.aria"></button>
        </article>
        <article class="fact-card">
          <p class="fact-kicker" data-i18n="ui.facts.kicker"></p>
          <blockquote class="fact-quote" data-i18n="ui.facts.check60.title"></blockquote>
          <p data-i18n="ui.facts.check60.text"></p>
          <button class="btn btn--quiet fact-copy" type="button" data-copy-fact="check60"
                  data-i18n="ui.facts.check60.copy" data-i18n-aria-label="ui.facts.check60.aria"></button>
        </article>
      </div>
      <p id="facts-status" class="copy-status" role="status" aria-live="polite"></p>
      <p class="facts-note" data-i18n="ui.facts.shareNote"></p>
    </section>

    <section class="info-section" aria-labelledby="how-title">
      <h2 id="how-title" data-i18n="ui.how.title"></h2>
      <ul class="how-list">
        <li data-i18n="ui.how.1"></li>
        <li data-i18n="ui.how.2"></li>
        <li data-i18n="ui.how.3"></li>
        <li data-i18n="ui.how.4"></li>
      </ul>
    </section>

    <section class="info-section" aria-labelledby="verdict-title">
      <h2 id="verdict-title" data-i18n="ui.verdict.title"></h2>
      <p class="section-intro" data-i18n="ui.verdict.intro"></p>
      <dl class="verdict-list">
        <div class="verdict-item">
          <dt data-i18n="ui.status.vulnerable"></dt>
          <dd data-i18n="ui.statusExplain.vulnerable"></dd>
        </div>
        <div class="verdict-item">
          <dt data-i18n="ui.status.likely_vulnerable"></dt>
          <dd data-i18n="ui.statusExplain.likely_vulnerable"></dd>
        </div>
        <div class="verdict-item">
          <dt data-i18n="ui.status.not_vulnerable"></dt>
          <dd data-i18n="ui.statusExplain.not_vulnerable"></dd>
        </div>
        <div class="verdict-item">
          <dt data-i18n="ui.status.not_applicable"></dt>
          <dd data-i18n="ui.statusExplain.not_applicable"></dd>
        </div>
        <div class="verdict-item">
          <dt data-i18n="ui.status.unknown"></dt>
          <dd data-i18n="ui.statusExplain.unknown"></dd>
        </div>
      </dl>
    </section>

    <section class="info-section" aria-labelledby="versions-title">
      <h2 id="versions-title" data-i18n="ui.versions.title"></h2>
      <p class="section-intro" data-i18n="ui.versions.intro"></p>
      <div class="table-wrap">
        <table class="versions-table">
          <caption class="visually-hidden" data-i18n="ui.versions.title"></caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="ui.versions.branch"></th>
              <th scope="col" data-i18n="ui.versions.fixed"></th>
              <th scope="col" data-i18n="ui.versions.status"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>8.5</code></td>
              <td><code>8.5.12</code></td>
              <td><span class="badge badge--fixed" data-i18n="ui.versions.fixedStatus"></span></td>
            </tr>
            <tr>
              <td><code>8.4</code></td>
              <td><code>8.4.27</code></td>
              <td><span class="badge badge--fixed" data-i18n="ui.versions.fixedStatus"></span></td>
            </tr>
            <tr>
              <td><code>8.3</code></td>
              <td><code>8.3.36</code></td>
              <td><span class="badge badge--fixed" data-i18n="ui.versions.fixedStatus"></span></td>
            </tr>
            <tr>
              <td><code>8.2</code></td>
              <td><code>8.2.35</code></td>
              <td><span class="badge badge--fixed" data-i18n="ui.versions.fixedStatus"></span></td>
            </tr>
            <tr class="versions-table__row--none">
              <td><code>8.1</code> / <code>8.0</code> / <code>7.x</code> / <code>5.x</code></td>
              <td>—</td>
              <td><span class="badge badge--none" data-i18n="ui.versions.noneStatus"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="info-section" aria-labelledby="faq-title">
      <h2 id="faq-title" data-i18n="ui.faq.title"></h2>
      <div class="faq-list">
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q1"></h3>
          <p data-i18n="ui.faq.a1"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q2"></h3>
          <p data-i18n="ui.faq.a2"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q3"></h3>
          <p data-i18n="ui.faq.a3"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q4"></h3>
          <p data-i18n="ui.faq.a4"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q5"></h3>
          <p data-i18n="ui.faq.a5"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q6"></h3>
          <p data-i18n="ui.faq.a6"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q7"></h3>
          <p data-i18n="ui.faq.a7"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q8"></h3>
          <p data-i18n="ui.faq.a8"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q9"></h3>
          <p data-i18n="ui.faq.a9"></p>
        </article>
        <article class="faq-item">
          <h3 data-i18n="ui.faq.q10"></h3>
          <p data-i18n="ui.faq.a10"></p>
        </article>
      </div>
    </section>

    <section class="info-section" aria-labelledby="sources-title">
      <h2 id="sources-title" data-i18n="ui.sources.title"></h2>
      <p class="section-intro" data-i18n="ui.sources.intro"></p>
      <ul class="sources-list">
        <li>
          <a href="https://github.com/advisories/GHSA-w8hw-w9fx-j79w" rel="noopener">GHSA-w8hw-w9fx-j79w</a>
          <span data-i18n="ui.sources.ghsa1"></span>
        </li>
        <li>
          <a href="https://github.com/advisories/GHSA-6wmf-4rv5-p3rp" rel="noopener">GHSA-6wmf-4rv5-p3rp</a>
          <span data-i18n="ui.sources.ghsa2"></span>
        </li>
        <li>
          <a href="https://isc.sans.edu/diary/33440" rel="noopener">isc.sans.edu/diary/33440</a>
          <span data-i18n="ui.sources.isc"></span>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div id="badge" class="badge-box" aria-labelledby="badge-title">
        <div class="badge-copy">
          <h2 id="badge-title" data-i18n="ui.badge.title"></h2>
          <p data-i18n="ui.badge.intro"></p>
          <span class="php2shell-badge">Checked with PHP2Shell</span>
          <code class="badge-markdown">[Checked with PHP2Shell](https://haveibeenphpned.github.io/)</code>
        </div>
        <div class="badge-action">
          <button id="copy-badge" class="btn btn--quiet" type="button"
                  data-i18n="ui.badge.copy" data-i18n-aria-label="ui.badge.copyAria"></button>
          <span id="badge-status" class="copy-status" role="status" aria-live="polite"></span>
        </div>
      </div>
      <p class="privacy-note" data-i18n="ui.privacy.note"></p>
      <p data-i18n="ui.footer.disclaimer"></p>
      <p class="footer-meta" data-i18n="ui.footer.meta"></p>
      <p class="footer-updated" data-i18n="ui.footer.updated"></p>
    </div>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
